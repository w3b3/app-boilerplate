openapi: 3.1.0
info:
  version: '1'
  title: Boilerplate CRUD API
  description: |-
    Boilerplate CRUD API.

    Some useful links:
    - [Github](https://github.com/w3b3/app-boilerplate)

servers:
  - url: http://localhost:1234
tags:
  - name: item
    description: Everything about your items
    externalDocs:
      description: Find out more
      url: https://github.com/w3b3/app-boilerplate
paths:
  /item:
    put:
      tags:
        - item
      summary: Update an existing item
      description: Update an existing item by Id
      operationId: updateItem
      requestBody:
        description: Update an existent item in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/item'
          application/xml:
            schema:
              $ref: '#/components/schemas/item'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/item'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/item'
            application/xml:
              schema:
                $ref: '#/components/schemas/item'
        '400':
          description: Invalid ID supplied
        '404':
          description: item not found
        '422':
          description: Validation exception
      security:
        - itemstore_auth:
            - write:items
            - read:items
    post:
      tags:
        - item
      summary: Add a new item to the store
      description: Add a new item to the store
      operationId: addItem
      requestBody:
        description: Create a new item in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/item'
          application/xml:
            schema:
              $ref: '#/components/schemas/item'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/item'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/item'
            application/xml:
              schema:
                $ref: '#/components/schemas/item'
        '400':
          description: Invalid input
        '422':
          description: Validation exception
      security:
        - itemstore_auth:
            - write:items
            - read:items
  /item/{itemId}:
    get:
      tags:
        - item
      summary: Find item by ID
      description: Returns a single item
      operationId: getItemById
      parameters:
        - name: itemId
          in: path
          description: ID of item to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/item'
            application/xml:
              schema:
                $ref: '#/components/schemas/item'
        '400':
          description: Invalid ID supplied
        '404':
          description: item not found
      security:
        - api_key: [ ]
        - itemstore_auth:
            - write:items
            - read:items
    post:
      tags:
        - item
      summary: Updates a item in the store with form data
      description: ''
      operationId: updateItemWithForm
      parameters:
        - name: itemId
          in: path
          description: ID of item that needs to be updated
          required: true
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          description: Name of item that needs to be updated
          schema:
            type: string
        - name: status
          in: query
          description: Status of item that needs to be updated
          schema:
            type: string
      responses:
        '400':
          description: Invalid input
      security:
        - itemstore_auth:
            - write:items
            - read:items
    delete:
      tags:
        - item
      summary: Deletes a item
      description: delete a item
      operationId: deleteItem
      parameters:
        - name: api_key
          in: header
          description: ''
          required: false
          schema:
            type: string
        - name: itemId
          in: path
          description: item id to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '400':
          description: Invalid item value
      security:
        - itemstore_auth:
            - write:items
            - read:items
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [ 10 ]
        itemId:
          type: integer
          format: int64
          examples: [ 198772 ]
        quantity:
          type: integer
          format: int32
          examples: [ 7 ]
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          description: Order Status
          examples: [ approved ]
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean
      xml:
        name: order
    Customer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [ 100000 ]
        username:
          type: string
          examples: [ fehguy ]
        address:
          type: array
          xml:
            name: addresses
            wrapped: true
          items:
            $ref: '#/components/schemas/Address'
      xml:
        name: customer
    Address:
      type: object
      properties:
        street:
          type: string
          examples: [ 437 Lytton ]
        city:
          type: string
          examples: [ Palo Alto ]
        state:
          type: string
          examples: [ CA ]
        zip:
          type: string
          examples: [ '94301' ]
      xml:
        name: address
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [ 1 ]
        name:
          type: string
          examples: [ Dogs ]
      xml:
        name: category
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [ 10 ]
        username:
          type: string
          examples: [ theUser ]
        firstName:
          type: string
          examples: [ John ]
        lastName:
          type: string
          examples: [ James ]
        email:
          type: string
          examples: [ john@email.com ]
        password:
          type: string
          examples: [ '12345' ]
        phone:
          type: string
          examples: [ '12345' ]
        userStatus:
          type: integer
          description: User Status
          format: int32
          examples: [ 1 ]
      xml:
        name: user
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      xml:
        name: tag
    item:
      required:
        - name
        - photoUrls
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [ 10 ]
        name:
          type: string
          examples: [ doggie ]
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          xml:
            wrapped: true
          items:
            type: string
            xml:
              name: photoUrl
        tags:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: item status in the store
          enum:
            - available
            - pending
            - sold
      xml:
        name: item
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
      xml:
        name: '##default'
  requestBodies:
    item:
      description: item object that needs to be added to the store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/item'
        application/xml:
          schema:
            $ref: '#/components/schemas/item'
    UserArray:
      description: List of user object
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
  securitySchemes:
    itemstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://itemstore3.swagger.io/oauth/authorize
          scopes:
            write:items: modify items in your account
            read:items: read your items
    api_key:
      type: apiKey
      name: api_key
      in: header
